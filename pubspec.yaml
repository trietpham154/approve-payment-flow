name: approve_payment_flow
description: "Approve Payment Flow - Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  get_it: ^9.2.1
  drift: ^2.18.0
  drift_flutter: ^0.2.6
